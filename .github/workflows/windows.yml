name: Windows — kompilacja, testy i paczka EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Kompilacja, testy i samodzielna paczka Windows
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - name: Sprawdzenie Workera i migracji na Windows
        shell: pwsh
        run: |
          $smokeRoot = "$env:RUNNER_TEMP/wcm-smoke"
          $worker = Start-Process -FilePath './artifacts/WheelContentManager/Worker/WheelContentManager.Worker.exe' -ArgumentList @('--data-root', $smokeRoot, '--diagnose') -Wait -PassThru
          if ($worker.ExitCode -ne 0 -or !(Test-Path "$smokeRoot/content.db")) { throw 'Worker nie przeszedł diagnostyki.' }
      - name: Sprawdzenie rejestracji zadania przygotowania w tle
        shell: pwsh
        run: |
          $taskFile = "$env:RUNNER_TEMP/wt-background.xml"
          $process = Start-Process -FilePath './artifacts/WheelContentManager/Worker/WheelContentManager.Worker.exe' -ArgumentList @('--data-root', "$env:RUNNER_TEMP/wcm-smoke", '--write-background-task', $taskFile) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Nie zapisano definicji zadania.' }
          [xml]$definition = Get-Content $taskFile
          $definition.Task.Settings.Enabled = 'false'
          $definition.Save($taskFile)
          $taskName = "WT-Blog-CI-$env:GITHUB_RUN_ID"
          try {
            & schtasks.exe /Create /TN $taskName /XML $taskFile /F
            if ($LASTEXITCODE -ne 0) { throw 'Windows odrzucił definicję przygotowania w tle.' }
            & schtasks.exe /Query /TN $taskName
            if ($LASTEXITCODE -ne 0) { throw 'Nie znaleziono zarejestrowanego zadania.' }
          } finally {
            & schtasks.exe /Delete /TN $taskName /F
          }
      - name: Anulowanie osobnego procesu bez AI i e-maila
        shell: pwsh
        run: |
          $controlRoot = "$env:RUNNER_TEMP/wt-cancel-smoke"
          $process = Start-Process -FilePath './artifacts/WheelContentManager/Worker/WheelContentManager.Worker.exe' -ArgumentList @('--data-root', $controlRoot, '--operation-smoke') -PassThru
          try {
            $stateFile = "$controlRoot/operation-state.json"
            for ($i = 0; $i -lt 100 -and !(Test-Path $stateFile) -and !$process.HasExited; $i++) { Start-Sleep -Milliseconds 200 }
            if (!(Test-Path $stateFile)) { throw 'Worker nie udostępnił stanu operacji.' }
            $state = Get-Content $stateFile -Raw | ConvertFrom-Json
            [System.IO.File]::WriteAllText("$controlRoot/operation-cancel.txt", $state.Id)
            if (!$process.WaitForExit(10000)) { throw 'Worker nie zareagował na anulowanie.' }
            if ($process.ExitCode -ne 2) { throw 'Nieprawidłowy wynik anulowania.' }
            if (Test-Path $stateFile) { throw 'Pozostała aktywna operacja po anulowaniu.' }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Instalator Inno Setup
        shell: pwsh
        run: |
          $compiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Brak kompilatora Inno Setup 6 na runnerze Windows.' }
          & $compiler ./scripts/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Nie udało się zbudować instalatora.' }
      - uses: actions/upload-artifact@v4
        with:
          name: WT-Blog-Generator-Windows
          path: |
            artifacts/WT-Blog-Generator-win-x64.zip
            artifacts/WT-Blog-Generator-Setup.exe
          if-no-files-found: error
