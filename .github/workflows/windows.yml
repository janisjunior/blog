name: Windows — kompilacja, testy i paczka EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Kompilacja, testy i samodzielna paczka Windows
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - name: Sprawdzenie Workera i migracji na Windows
        shell: pwsh
        run: |
          & ./artifacts/WheelContentManager/Worker/WheelContentManager.Worker.exe --data-root "$env:RUNNER_TEMP/wcm-smoke" --diagnose
          if ($LASTEXITCODE -ne 0) { throw 'Worker nie przeszedł diagnostyki.' }
      - name: Instalator Inno Setup
        shell: pwsh
        run: |
          $compiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Brak kompilatora Inno Setup 6 na runnerze Windows.' }
          & $compiler ./scripts/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Nie udało się zbudować instalatora.' }
      - uses: actions/upload-artifact@v4
        with:
          name: WheelContentManager-Windows
          path: |
            artifacts/WheelContentManager-win-x64.zip
            artifacts/WheelContentManager-Setup.exe
          if-no-files-found: error
